{% extends "base.html" %}

{% block content %}
<h1 class="text-3xl font-bold mb-6">All projects</h1>
<div class="grid md:grid-cols-2 gap-6">
  {% for project in projects %}
    <a href="/projects/{{ project.slug }}" class="block border rounded-lg p-5 bg-white hover:shadow">
      <h2 class="font-bold text-lg">{{ project.title }}</h2>
      <p class="text-gray-600 text-sm mt-1">{{ project.summary }}</p>
      <p class="text-xs text-gray-400 mt-3">{{ project.stack | join(" · ") }}</p>
    </a>
  {% endfor %}
</div>
{% endblock %}
